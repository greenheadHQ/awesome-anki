name: Publish Container Image

on:
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  group: publish-container
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-')) }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:smoke-test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: |
          docker run -d --name smoke-test -p 3100:3100 \
            -e ANKI_SPLITTER_REQUIRE_API_KEY=false \
            -e ANKI_CONNECT_URL=http://localhost:8765 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:smoke-test

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/api/health > /dev/null 2>&1; then
              echo "✅ Health check passed"
              docker rm -f smoke-test
              exit 0
            fi
            sleep 1
          done

          echo "❌ Health check failed after 30s"
          docker logs smoke-test
          docker rm -f smoke-test
          exit 1

      - name: Push tested image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:smoke-test"
          while IFS= read -r tag; do
            docker tag "$IMAGE" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
